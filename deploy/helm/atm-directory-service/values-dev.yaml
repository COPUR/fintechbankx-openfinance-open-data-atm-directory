# Dev: smaller footprint, still two replicas so rollouts and PDBs are exercised.
replicaCount: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 4
podDisruptionBudget:
  minAvailable: 1
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
topologySpread:
  maxSkew: 2
config:
  ATM_DIRECTORY_SEED_ENABLED: "true"
