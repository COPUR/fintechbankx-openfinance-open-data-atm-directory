# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

# Platform contract: every svc-of-* service runs in the open-finance namespace
# (install with --namespace open-finance); the chart renders into .Release.Namespace.
namespace: open-finance

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/atm-directory-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

serviceAccount:
  name: atm-directory-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

podLabels:
  app.kubernetes.io/part-of: fintechbankx-open-finance
  fintechbankx.io/service-id: svc-of-atm-directory

mesh:
  # Istio sidecar (namespace has STRICT mTLS); kept as a value so it can be changed.
  sidecarInject: "true"

service:
  port: 8080
  managementPort: 8081

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 768Mi

# Read-only public data: pods are stateless and cheap, so the HPA may scale wide.
# Keep maxReplicas x DB_POOL_MAX under the Aurora connection alarm in deploy/terraform.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap.
config:
  # The service only reads: DB_URL is the Aurora reader endpoint (terraform output reader_jdbc_url),
  # FLYWAY_URL the writer (output jdbc_url). Empty FLYWAY_URL means "migrate through DB_URL" (single instance).
  # Both are parsed strictly (exactly one sslmode=verify-full and one sslrootcert, no other ssl*
  # key or service), and no spring.datasource.* or spring.flyway.* key (except
  # SPRING_DATASOURCE_USERNAME), other jdbc: value or JVM options with JDBC, TLS or Spring
  # properties may be set here. Both verify Aurora's certificate against databaseCaBundle:
  # jdbc:postgresql://<endpoint>:5432/db_of_atm_directory_<env>?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem
  DB_URL: ""
  FLYWAY_URL: ""
  # Runtime role: SELECT on atm only (db/bootstrap/bootstrap-roles.sql, V3__grant_least_privilege.sql).
  DB_USERNAME: atm_directory_app
  DB_POOL_MAX: "5"
  ATM_DIRECTORY_SEED_ENABLED: "false"   # sample ATMs; dev only, never staging/prod

# Amazon RDS CA bundle for PostgreSQL TLS (sslmode=verify-full). The platform's
# trust-manager publishes ConfigMap rds-ca-bundle (key global-bundle.pem) into every
# service namespace (platform contract, "Database CA bundle"); the chart mounts it
# read-only into the migrate init container and the service container, and every
# JDBC URL must point sslrootcert at <mountPath>/<key>.
databaseCaBundle:
  configMapName: rds-ca-bundle
  key: global-bundle.pem
  mountPath: /etc/fintechbankx/rds-ca

# Flyway runs in the "migrate" init container as the schema owner.
migration:
  username: atm_directory_migrate

# Database credentials, synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Secrets Manager secret <env>/atm-directory-service/db-app (deploy/terraform output app_db_secret_name).
  remoteSecretName: ""
  # Secrets Manager secret <env>/atm-directory-service/db-migration (output migration_db_secret_name);
  # only the migrate init container reads it.
  migrationRemoteSecretName: ""
  refreshInterval: 1h
  # Bump (e.g. to the rotation date) after rotating a password in Secrets Manager: the
  # ExternalSecrets re-sync and checksum/secret rolls the pods onto the new credential.
  rotation: ""

topologySpread:
  maxSkew: 1

networkPolicy:
  # Opt-in. The platform mesh repository owns NetworkPolicy (cicd-templates
  # 1dd1138 turns chart policies off by default); enable only where the mesh
  # repository does not already cover this namespace.
  enabled: false
  # API traffic only from the ingress gateway; metrics only from Prometheus.
  gatewayNamespace: istio-ingress
  prometheusNamespace: observability
  # Aurora subnets (private_subnet_ids CIDRs); PostgreSQL is reached on 5432 only.
  # Required when enabled: rendering fails while this list is empty.
  databaseCidrs: []
  istiodNamespace: istio-system
