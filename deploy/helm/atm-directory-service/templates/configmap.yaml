{{- $_ := required "config.DB_URL is required (terraform output reader_jdbc_url)" .Values.config.DB_URL }}
{{- /* Aurora's certificate is verified against the platform RDS CA bundle (platform contract, Database CA bundle). */}}
{{- $ca := printf "sslrootcert=%s/%s" .Values.databaseCaBundle.mountPath .Values.databaseCaBundle.key }}
{{- range $key := list "DB_URL" "FLYWAY_URL" }}
{{- $url := index $.Values.config $key | default "" }}
{{- if and $url (not (and (regexMatch "[?&]sslmode=verify-full(&|$)" $url) (regexMatch (printf "[?&]%s(&|$)" (regexQuoteMeta $ca)) $url))) }}
{{- fail (printf "config.%s must use sslmode=verify-full&%s (deploy/terraform outputs reader_jdbc_url and jdbc_url)" $key $ca) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atm.name" . }}
  labels:
    {{- include "atm.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- /* Empty values are left out so application.yml defaults apply (e.g. FLYWAY_URL falls back to DB_URL). */}}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
