{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.databaseCidrs }}
{{- fail "networkPolicy.databaseCidrs is required: the Aurora subnet CIDRs the pods may reach on 5432" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atm.name" . }}
  labels:
    {{- include "atm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atm.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Public API, but only through the ingress gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - port: http
          protocol: TCP
    # Metrics and probes scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
      ports:
        - port: management
          protocol: TCP
    # Istio sidecar: 15021 health (rewritten kubelet probes), 15020 merged Prometheus metrics.
    - ports:
        - port: 15020
          protocol: TCP
        - port: 15021
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Istio sidecar configuration (xDS) from istiod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.istiodNamespace }}
      ports:
        - port: 15012
          protocol: TCP
    # Aurora PostgreSQL only. The service makes no other outbound calls (no Kafka, no token validation).
    - to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
