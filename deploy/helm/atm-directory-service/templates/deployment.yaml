apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atm.name" . }}
  labels:
    {{- include "atm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "atm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atm.selectorLabels" . | nindent 8 }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        app: {{ include "atm.name" . }}
        version: {{ .Values.image.tag | quote }}
        sidecar.istio.io/inject: {{ .Values.mesh.sidecarInject | quote }}
      annotations:
        sidecar.istio.io/inject: {{ .Values.mesh.sidecarInject | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        # The migrate init container runs before the Istio sidecar exists; Aurora is outside
        # the mesh and is reached with TLS (sslmode=require), so 5432 bypasses the proxy.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "atm.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "atm.selectorLabels" . | nindent 14 }}
      initContainers:
        # Flyway with the schema owner's credential (secret db-migrate); exits when the
        # schema is current. The service container below never holds this credential.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--spring.main.web-application-type=none"]
          envFrom:
            - configMapRef:
                name: {{ include "atm.name" . }}
          env:
            - name: DB_USERNAME
              value: {{ required "migration.username is required" .Values.migration.username | quote }}
            {{- with .Values.config.FLYWAY_URL }}
            - name: DB_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.externalSecret.enabled }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atm.migrateSecretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "atm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: atm-directory-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "atm.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "atm.secretName" . }}
            {{- end }}
          env:
            # Migrations ran in the init container; the runtime role may only SELECT.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "atm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
