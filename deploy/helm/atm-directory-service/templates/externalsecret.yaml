{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "atm.secretName" . }}
  labels:
    {{- include "atm.labels" . | nindent 4 }}
  annotations:
    fintechbankx.io/rotation: {{ .Values.externalSecret.rotation | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "atm.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: "SPRING_DATASOURCE_PASSWORD"
      remoteRef:
        key: {{ required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName | quote }}
        property: "password"
---
# Schema owner credential, mounted only into the migrate init container.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "atm.migrationSecretName" . }}
  labels:
    {{- include "atm.labels" . | nindent 4 }}
  annotations:
    fintechbankx.io/rotation: {{ .Values.externalSecret.rotation | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "atm.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: "SPRING_DATASOURCE_PASSWORD"
      remoteRef:
        key: {{ required "externalSecret.migrationRemoteSecretName is required" .Values.externalSecret.migrationRemoteSecretName | quote }}
        property: "password"
{{- end }}
