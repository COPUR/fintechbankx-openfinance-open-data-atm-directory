plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.6'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.enterprise.openfinance'
version = '0.1.0'
description = 'svc-of-atm-directory - public ATM directory (open data)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Persistence: PostgreSQL is the directory authority (schema sc_of_atm_directory,
    // Flyway migrations in src/main/resources/db/migration, optional seed in db/seed).
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.22.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Spring 6.1+ resolves @RequestParam / @Param names from parameter metadata.
    options.compilerArgs << '-parameters'
}

springBoot {
    mainClass = 'com.enterprise.openfinance.atmdirectory.Application'
    buildInfo()
}

bootJar {
    archiveFileName = 'atm-directory-service.jar'
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
    // Integration tests read TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD. Without a
    // database they are skipped locally but fail in CI (CI=true or JENKINS_URL set).
    inputs.property('testDbConfigured', System.getenv('TEST_DB_URL') != null)
    inputs.property('ciRun', System.getenv('CI') != null || System.getenv('JENKINS_URL') != null)
    // No endpoint needs a token: the boot test proves the service starts with no OIDC_* setting.
    environment = environment.findAll { name, value -> !name.startsWith('OIDC_') }
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
