# svc-of-atm-directory runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: atm-directory-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_of_atm_directory_local}
    username: ${DB_USERNAME:atm_directory_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_of_atm_directory
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 3000
      max-lifetime: 1200000
      # The service never writes: every pooled session is read-only, including autocommit
      # statements (pgjdbc readOnlyMode=always). Flyway uses its own connection below.
      read-only: true
      data-source-properties:
        readOnlyMode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_of_atm_directory
        jdbc:
          time_zone: UTC
  flyway:
    schemas: sc_of_atm_directory
    default-schema: sc_of_atm_directory
    create-schemas: true
    locations: classpath:db/migration
    # Flyway writes, so it uses its own connection rather than the read-only pool.
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${FLYWAY_USER:${spring.datasource.username}}
    password: ${FLYWAY_PASSWORD:${spring.datasource.password:}}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-of-atm-directory
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-of-atm-directory

atm-directory:
  seed:
    # Loads the sample ATMs in classpath:db/seed. Dev and CI only; never in staging/prod.
    enabled: ${ATM_DIRECTORY_SEED_ENABLED:false}
  cache:
    # Cache-Control max-age on GET /open-finance/v1/atms (clients revalidate with the ETag).
    max-age: ${ATM_DIRECTORY_CACHE_MAX_AGE:PT60S}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
