          for name, part in (("migrate init container", init), ("service container", main)):
              assert mount in part, f"{name} does not mount rds-ca-bundle read-only at /etc/fintechbankx/rds-ca"
          assert ("- name: rds-ca-bundle\n          configMap:\n            name: \"rds-ca-bundle\"\n"
                  "            items:\n              - key: \"global-bundle.pem\"\n                path: \"global-bundle.pem\"") in volumes, \
              "volume rds-ca-bundle must project key global-bundle.pem of ConfigMap rds-ca-bundle"
          print("rds-ca-bundle mounted in both containers")
          PY
      - name: API pods and every selector carry app.kubernetes.io/component=service
        run: |
          # The platform mesh grants egress by app.kubernetes.io/component=service (cicd-templates 335a345):
          # the API pod template carries it, and every selector (Deployment, topology spread, Service, PDB,
          # NetworkPolicy) includes it; the HPA scales that Deployment. NetworkPolicy is opt-in, so it is enabled here.
          chart=deploy/helm/atm-directory-service
          good='jdbc:postgresql://ci:5432/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          helm template ci "$chart" --namespace open-finance --set image.repository=ci/x --set image.tag=x \
            --set externalSecret.remoteSecretName=x --set externalSecret.migrationRemoteSecretName=x --set "config.DB_URL=$good" \
            --set networkPolicy.enabled=true --set "networkPolicy.databaseCidrs={10.0.0.0/24}" > component.yaml
          python3 - component.yaml <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          kinds = {d["kind"] for d in docs}
          want = ("app.kubernetes.io/component", "service")
          def sel(where, labels):
              assert labels and labels.get(want[0]) == want[1], f"{where} must include {want[0]}={want[1]}: {labels}"
          deployments = []
          for d in docs:
              k, n, spec = d["kind"], d["metadata"]["name"], d.get("spec") or {}
              if k == "Deployment":
                  deployments.append(n)
                  sel(f"Deployment/{n} selector", spec["selector"]["matchLabels"])
                  sel(f"Deployment/{n} pod template labels", spec["template"]["metadata"]["labels"])
                  spreads = spec["template"]["spec"].get("topologySpreadConstraints") or []
                  assert spreads, f"Deployment/{n} must declare topology spread constraints"
                  for c in spreads:
                      sel(f"Deployment/{n} topology spread", c["labelSelector"]["matchLabels"])
              elif k == "Service":
                  sel(f"Service/{n} selector", spec["selector"])
              elif k == "PodDisruptionBudget":
                  sel(f"PodDisruptionBudget/{n} selector", spec["selector"]["matchLabels"])
              elif k == "NetworkPolicy":
                  sel(f"NetworkPolicy/{n} podSelector", spec["podSelector"]["matchLabels"])
              elif k == "HorizontalPodAutoscaler":
                  t = spec["scaleTargetRef"]
                  assert t["kind"] == "Deployment", f"HorizontalPodAutoscaler/{n} must scale a Deployment: {t}"
          for d in docs:
              if d["kind"] == "HorizontalPodAutoscaler":
                  assert d["spec"]["scaleTargetRef"]["name"] in deployments, "the HPA must scale the labelled Deployment"
          for k in ("Deployment", "Service", "PodDisruptionBudget", "NetworkPolicy", "HorizontalPodAutoscaler"):
              assert k in kinds, f"rendered chart has no {k}"
          print("component=service on the API pod template and on every selector; the HPA scales that Deployment")
          PY
          rm -f component.yaml
      - name: Every upstream guard case of a4f0072..73e1881 that applies to this chart's adapter
        run: |
          # The full upstream set (helm-unittest suites and validate-chart.sh must_fail cases added with the
          # vendored guard), mapped to this chart's routes; scripts/ci/guard-upstream-cases.sh says how.
          bash scripts/ci/guard-upstream-cases.sh deploy/helm/atm-directory-service --database-ca --no-kafka-runtime \
            --stricter 'extraEnv is refused \(|is refused: JVM options must not mention jdbc, ssl, spring, kafka' -- \
            --namespace open-finance --set image.repository=ci/x --set image.tag=${{ github.sha }} --set externalSecret.remoteSecretName=x --set externalSecret.migrationRemoteSecretName=x --set "config.DB_URL=jdbc:postgresql://ci:5432/x?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: JDBC outputs verify the server certificate against the mounted RDS CA bundle
        run: |
          if grep -n "sslmode=require" outputs.tf; then
            echo "JDBC outputs must use sslmode=verify-full, not sslmode=require"; exit 1
          fi
          test "$(grep -c 'sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"' outputs.tf)" -eq 2

  data-migration:
    name: deploy/data-migration-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rehearsal
          # A throwaway CI database that trusts its clients for this job only, so no credential is written here.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: rehearsal
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse migrations, sample seed and idempotent ATM import
        run: scripts/migration/verify-migration.sh
