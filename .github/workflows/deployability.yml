name: Deployability

# Proves every change still produces a runnable image, valid deployment
# manifests and a working data path. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag atm-directory-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' atm-directory-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint and render chart
        run: |
          chart=deploy/helm/atm-directory-service
          args="--namespace open-finance --set image.repository=ci/atm-directory-service --set image.tag=${{ github.sha }} --set externalSecret.remoteSecretName=ci/atm-directory-service/db-app --set externalSecret.migrationRemoteSecretName=ci/atm-directory-service/db-migration --set networkPolicy.databaseCidrs={10.0.0.0/24} --set config.DB_URL=jdbc:postgresql://ci:5432/db_of_atm_directory_ci"
          helm lint "$chart" $args
          helm template ci "$chart" $args > /dev/null
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args > /dev/null

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  data-migration:
    name: deploy/data-migration-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rehearsal
          POSTGRES_PASSWORD: rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: rehearsal
      PGPASSWORD: rehearsal
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse migrations, sample seed and idempotent ATM import
        run: scripts/migration/verify-migration.sh
