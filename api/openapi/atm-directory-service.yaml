openapi: 3.0.3
info:
  title: ATM Directory Service API
  version: 0.1.0
  description: Public API to list ATM locations and status.
servers:
  - url: https://api.example.com/open-finance/v1
paths:
  /atms:
    get:
      summary: List ATMs
      security: []
      operationId: listAtms
      tags:
        - ATMs
      parameters:
        - $ref: '#/components/parameters/InteractionId'
        - $ref: '#/components/parameters/AuthorizationOptional'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/Radius'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: ATM list
          headers:
            X-FAPI-Interaction-ID:
              schema:
                type: string
            X-OF-Cache:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Cache-Control:
              description: Public, short-lived cache (for example `max-age=60, public`); revalidate with If-None-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtmListResponse'
        '304':
          description: Not modified
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Directory store temporarily unavailable; retry after the given number of seconds
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    InteractionId:
      name: X-FAPI-Interaction-ID
      in: header
      required: true
      schema:
        type: string
    AuthorizationOptional:
      name: Authorization
      in: header
      required: false
      description: Not needed (public data). When sent, it must use the Bearer or DPoP scheme.
      schema:
        type: string
    Latitude:
      name: lat
      in: query
      required: false
      description: Latitude of the search centre. Must be sent together with `long`.
      schema:
        type: number
        format: double
    Longitude:
      name: long
      in: query
      required: false
      description: Longitude of the search centre. Must be sent together with `lat`.
      schema:
        type: number
        format: double
    Radius:
      name: radius
      in: query
      required: false
      description: Search radius in km, greater than 0 and at most 50; defaults to 10. Ignored without `lat` and `long`.
      schema:
        type: number
        format: double
        exclusiveMinimum: true
        minimum: 0
        maximum: 50
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
  schemas:
    AtmListResponse:
      type: object
      properties:
        Data:
          type: object
          properties:
            ATM:
              type: array
              items:
                $ref: '#/components/schemas/Atm'
        Links:
          type: object
          properties:
            Self:
              type: string
        Meta:
          type: object
          properties:
            TotalRecords:
              type: integer
    Atm:
      type: object
      properties:
        AtmId:
          type: string
        Name:
          type: string
        Status:
          type: string
        Latitude:
          type: number
          format: double
        Longitude:
          type: number
          format: double
        Address:
          type: string
        City:
          type: string
        Country:
          type: string
        Accessibility:
          type: string
        Services:
          type: array
          items:
            type: string
        Currency:
          type: string
          description: ISO 4217 code of the currency the ATM dispenses.
          pattern: '^[A-Z]{3}$'
        UpdatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        interactionId:
          type: string
        timestamp:
          type: string
          format: date-time
